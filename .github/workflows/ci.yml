name: Toolkit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Validate Python scripts (and scripts/lib/) compile without syntax errors.
      # Golden trees hold rendered scaffold output, not code under test here.
      - name: Check script syntax
        run: |
          find scripts tests templates -name '*.py' -not -path 'tests/golden/*' -print0 \
            | xargs -0 -n1 python -m py_compile

      # Run the pytest suite: golden-file scaffold tests, parser fixtures, and
      # unit tests for the validators (tests/README.md documents the layout).
      - name: Run test suite
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      # Run the skill audit — exits non-zero on broken @skill refs or
      # frontmatter drift (fix drift locally with: audit_skills.py --fix)
      - name: Audit skill coverage
        run: python3 scripts/audit_skills.py --no-color

      # skills-index.json and CATEGORIES.md are generated from skill
      # frontmatter; fail if they drift (regenerate with build_skills_index.py)
      - name: Check skills index is current
        run: python3 scripts/build_skills_index.py --check

      # Teams/org.json and agents/*.md are generated from role files;
      # fail if either drifts (build_org.py / build_agents.py)
      - name: Check org data and agents are current
        run: |
          python3 scripts/build_org.py --check
          python3 scripts/build_agents.py --check

      # The plugin packaging (.claude-plugin/, hooks/, commands/, agents/) is
      # not executed by any other check; validate the manifests parse, the
      # referenced hook scripts exist, and the two protect-main copies
      # (plugin runtime vs scaffold template) have not drifted.
      - name: Validate plugin packaging
        run: python3 scripts/check_plugin.py

      # Check VERSION, CHANGELOG, CLAUDE.md, and GEMINI.md are in sync
      - name: Validate version sync
        run: python3 scripts/check_version.py

      # Check GEMINI.md and AGENTS.md match the rendering produced from CLAUDE.md.
      # CLAUDE.md is the source of truth; both files are generated by sync_ai_context.py.
      - name: Check CLAUDE.md / GEMINI.md / AGENTS.md sync
        run: python3 scripts/sync_ai_context.py --check

      # Enforce the Writing Standard (WRITING.md) on all maintained prose.
      # Vendored skill modules and the generated audit report are out of scope.
      - name: Validate writing standard
        run: |
          git ls-files -z '*.md' \
            | tr '\0' '\n' \
            | grep -v '^Teams/skills/' \
            | grep -v '^scripts/audit_report.md$' \
            | tr '\n' '\0' \
            | xargs -0 python3 scripts/check_writing.py

      # Scaffolded docs land in consuming repos, outside this repo's normal
      # writing check; render a full scaffold and hold it to the same standard.
      - name: Validate writing standard on rendered scaffold
        run: |
          python3 scripts/init_project.py --project-name "CI Render Check" \
            --departments "engineering,design" --level 4 --existing \
            --output-dir "$RUNNER_TEMP/scaffold"
          find "$RUNNER_TEMP/scaffold" -name '*.md' -print0 \
            | xargs -0 python3 scripts/check_writing.py

  # Tag each release automatically: when a version bump lands on main, create
  # the annotated v$(cat VERSION) tag if it does not exist yet. Consumers and
  # update.py rely on tags as stable anchors; this closes the gap where merges
  # shipped untagged.
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag if missing
        run: |
          VERSION="v$(cat VERSION)"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; nothing to do."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release ${VERSION#v}"
            git push origin "$VERSION"
            echo "Created and pushed $VERSION."
          fi
