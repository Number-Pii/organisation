name: Toolkit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Validate Python scripts compile without syntax errors
      - name: Check script syntax
        run: |
          python -m py_compile scripts/audit_skills.py
          python -m py_compile scripts/init_project.py
          python -m py_compile scripts/update.py
          python -m py_compile scripts/check_version.py
          python -m py_compile scripts/sync_ai_context.py
          python -m py_compile scripts/find_skill.py
          python -m py_compile scripts/generate_skill_frontmatter.py
          python -m py_compile scripts/check_writing.py
          python -m py_compile scripts/check_handover.py
          python -m py_compile scripts/gh_project_sync.py

      # Run the skill audit — fails if any @skill refs are broken
      - name: Audit skill coverage
        run: python3 scripts/audit_skills.py --no-color

      # Check VERSION, CHANGELOG, CLAUDE.md, and GEMINI.md are in sync
      - name: Validate version sync
        run: python3 scripts/check_version.py

      # Check GEMINI.md and AGENTS.md match the rendering produced from CLAUDE.md.
      # CLAUDE.md is the source of truth; both files are generated by sync_ai_context.py.
      - name: Check CLAUDE.md / GEMINI.md / AGENTS.md sync
        run: python3 scripts/sync_ai_context.py --check

      # Enforce the Writing Standard (WRITING.md) on all maintained prose.
      # Vendored skill modules and the generated audit report are out of scope.
      - name: Validate writing standard
        run: |
          git ls-files -z '*.md' \
            | tr '\0' '\n' \
            | grep -v '^Teams/skills/' \
            | grep -v '^scripts/audit_report.md$' \
            | tr '\n' '\0' \
            | xargs -0 python3 scripts/check_writing.py

  # Tag each release automatically: when a version bump lands on main, create
  # the annotated v$(cat VERSION) tag if it does not exist yet. Consumers and
  # update.py rely on tags as stable anchors; this closes the gap where merges
  # shipped untagged.
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag if missing
        run: |
          VERSION="v$(cat VERSION)"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; nothing to do."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release ${VERSION#v}"
            git push origin "$VERSION"
            echo "Created and pushed $VERSION."
          fi
