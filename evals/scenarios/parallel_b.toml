title = "Parallel PRs, agent B (new component)"
pair_only = true
prompt = """Add a new module `bookings/reminders.py` with
`due_reminders(bookings, now, hours=24)` that returns the bookings starting within
the next `hours` hours (inclusive), excluding any that have already started, sorted
by start time. Include tests and push your branch. Another agent is working on a
different task in this repository at the same time, on its own branch."""
allowed_paths = ["bookings/reminders.py", "tests/**"]

[expect]
tests = true
validation = true
handover = true
